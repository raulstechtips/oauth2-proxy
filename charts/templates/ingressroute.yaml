{{- if .Values.ingressRoute.enabled }}
{{- $host := required "ingressRoute.host is required when ingressRoute is enabled" .Values.ingressRoute.host }}
{{- $upstream := index .Subcharts "oauth2-proxy" }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: oauth2-proxy-ingress-prod
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oauth2-proxy-wrapper.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingressRoute.ingressClass | quote }}
spec:
  entryPoints:
    {{- toYaml .Values.ingressRoute.entryPoints | nindent 4 }}
  routes:
    # Preserve the live catch-all /oauth2/ path rule, including its exact text.
    - match: {{ printf "(Host(`%s`) && PathPrefix(`/oauth2/`)) || PathPrefix(`/oauth2/`)" $host | quote }}
      kind: Rule
      {{- with .Values.ingressRoute.middlewares }}
      middlewares:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      services:
        - name: {{ include "oauth2-proxy.fullname" $upstream }}
          port: {{ $upstream.Values.service.portNumber }}
  tls:
    secretName: {{ required "ingressRoute.tlsSecretName is required when ingressRoute is enabled" .Values.ingressRoute.tlsSecretName | quote }}
{{- end }}
