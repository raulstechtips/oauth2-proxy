suite: config secret mapping
templates:
  - templates/config-secret.yaml
release:
  name: oauth2-proxy
  namespace: oauth2-proxy
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0
  - it: preserves target keys source and orphan policy
    values:
      - ../ci/all-on-values.yaml
    asserts:
      - isKind:
          of: InfisicalStaticSecret
      - equal:
          path: metadata.name
          value: oauth2-proxy-config-secret
      - equal:
          path: spec.targets[0].name
          value: oauth2-proxy-config-secret
      - equal:
          path: spec.targets[0].creationPolicy
          value: Orphan
      - equal:
          path: spec.targets[0].secretType
          value: Opaque
      - equal:
          path: spec.sources[0]
          value:
            projectSlug: fake-project
            environmentSlug: fake-env
            secretPath: /oauth2/config
            recursive: true
      - equal:
          path: spec.syncOptions.refreshInterval
          value: 60s
      - equal:
          path: spec.targets[0].template.data
          value:
            OAUTH2_PROXY_ALLOWED_GROUPS: "{{ .OAUTH2_PROXY_ALLOWED_GROUPS.Value }}"
            OAUTH2_PROXY_COOKIE_DOMAINS: "{{ .OAUTH2_PROXY_COOKIE_DOMAINS.Value }}"
            OAUTH2_PROXY_EMAIL_DOMAINS: "{{ .OAUTH2_PROXY_EMAIL_DOMAINS.Value }}"
            OAUTH2_PROXY_OIDC_ISSUER_URL: "{{ .OAUTH2_PROXY_OIDC_ISSUER_URL.Value }}"
            OAUTH2_PROXY_PROVIDER: "{{ .OAUTH2_PROXY_PROVIDER.Value }}"
            OAUTH2_PROXY_REDIRECT_URL: "{{ .OAUTH2_PROXY_REDIRECT_URL.Value }}"
            OAUTH2_PROXY_SCOPE: "{{ .OAUTH2_PROXY_SCOPE.Value }}"
            OAUTH2_PROXY_WHITELIST_DOMAINS: "{{ .OAUTH2_PROXY_WHITELIST_DOMAINS.Value }}"
