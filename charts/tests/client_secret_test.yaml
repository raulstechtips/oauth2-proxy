suite: client secret mapping
templates:
  - templates/client-secret.yaml
release:
  name: oauth2-proxy
  namespace: oauth2-proxy
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0
  - it: preserves target keys source and orphan policy
    values:
      - ../ci/all-on-values.yaml
    asserts:
      - isKind:
          of: InfisicalStaticSecret
      - equal:
          path: metadata.name
          value: oauth2-proxy-client-secret
      - equal:
          path: spec.targets[0].name
          value: oauth2-proxy-client-secret
      - equal:
          path: spec.targets[0].creationPolicy
          value: Orphan
      - equal:
          path: spec.targets[0].secretType
          value: Opaque
      - equal:
          path: spec.sources[0]
          value:
            projectSlug: fake-project
            environmentSlug: fake-env
            secretPath: /oauth2/config
            recursive: true
      - equal:
          path: spec.syncOptions.refreshInterval
          value: 60s
      - equal:
          path: spec.targets[0].template.data
          value:
            client-id: "{{ .OAUTH2_PROXY_CLIENT_ID.Value }}"
            client-secret: "{{ .OAUTH2_PROXY_CLIENT_SECRET.Value }}"
            cookie-secret: "{{ .OAUTH2_PROXY_COOKIE_SECRET.Value }}"
