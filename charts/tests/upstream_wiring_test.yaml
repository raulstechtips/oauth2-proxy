suite: Upstream workload and Service contract
templates:
  - charts/oauth2-proxy/templates/deployment.yaml
  - charts/oauth2-proxy/templates/service.yaml
  - charts/oauth2-proxy/templates/configmap.yaml
  - charts/oauth2-proxy/templates/secret.yaml
release:
  name: oauth2-proxy
  namespace: oauth2-proxy
tests:
  - it: preserves the workload name image and replicas
    template: charts/oauth2-proxy/templates/deployment.yaml
    asserts:
      - equal:
          path: metadata.name
          value: oauth2-proxy
      - equal:
          path: spec.replicas
          value: 3
      - equal:
          path: spec.template.spec.containers[0].image
          value: quay.io/oauth2-proxy/oauth2-proxy:v7.13.0
      - contains:
          path: spec.template.spec.containers[0].args
          content: --reverse-proxy=true
      - contains:
          path: spec.template.spec.containers[0].args
          content: --cookie-csrf-per-request=true
      - contains:
          path: spec.template.spec.containers[0].args
          content: --code-challenge-method=S256
  - it: uses the two existing credential Secrets
    template: charts/oauth2-proxy/templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - secretRef:
                name: oauth2-proxy-config-secret
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OAUTH2_PROXY_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: oauth2-proxy-client-secret
                key: client-id
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OAUTH2_PROXY_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: oauth2-proxy-client-secret
                key: client-secret
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OAUTH2_PROXY_COOKIE_SECRET
            valueFrom:
              secretKeyRef:
                name: oauth2-proxy-client-secret
                key: cookie-secret
  - it: keeps the Service used by Traefik authentication middleware
    template: charts/oauth2-proxy/templates/service.yaml
    asserts:
      - equal:
          path: metadata.name
          value: oauth2-proxy
      - equal:
          path: spec.ports[0].port
          value: 80
  - it: preserves static upstream configuration
    template: charts/oauth2-proxy/templates/configmap.yaml
    asserts:
      - equal:
          path: data["oauth2_proxy.cfg"]
          value: 'upstreams = ["static://200"]'
  - it: never renders an upstream credentials Secret
    template: charts/oauth2-proxy/templates/secret.yaml
    asserts:
      - hasDocuments:
          count: 0
